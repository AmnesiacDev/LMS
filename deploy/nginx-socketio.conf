# ─────────────────────────────────────────────────────────────────────────────
# Socket.IO proxy for algogambit.online
#
# Symptom this fixes:
#   GET https://www.algogambit.online/socket.io/?EIO=4&transport=polling
#   -> 200 text/html  (the SPA's index.html)
#
# Socket.IO was never proxied, so /socket.io/ fell through to the SPA fallback
# (`try_files $uri /index.html`) and the client received HTML where it expected
# a handshake. Every websocket attempt then failed.
#
# Place this location block inside BOTH server blocks (apex and www), ABOVE the
# `location /` SPA fallback. Nginx picks the most specific prefix match, so
# order in the file does not strictly matter, but keeping it above `location /`
# makes the intent obvious.
#
# After editing:  sudo nginx -t && sudo systemctl reload nginx
# Verify:         curl -s "https://www.algogambit.online/socket.io/?EIO=4&transport=polling" | head -c 40
#                 expected: 0{"sid":"...","upgrades":["websocket"],...
# ─────────────────────────────────────────────────────────────────────────────

location /socket.io/ {
    proxy_pass http://127.0.0.1:3000;

    # Required for the HTTP/1.1 Upgrade handshake. Nginx talks HTTP/1.0
    # upstream by default, which cannot carry an Upgrade header.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A websocket is idle between messages. The default 60s read timeout would
    # drop a healthy connection and force a reconnect loop.
    proxy_read_timeout  86400;
    proxy_send_timeout  86400;

    # Buffering breaks the long-poll transport used before the upgrade.
    proxy_buffering off;
}
